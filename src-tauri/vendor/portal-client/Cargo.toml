[package]
name = "portal-client"
version = "1.6.0"
edition = "2021"
description = "Single-attempt trusted-native Portal text adapter"
license = "MIT"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["arbitrary_precision"] }
socket2 = "=0.6.5"
sha2 = "=0.10.9"

[features]
default = []
host-fixtures = []
operator-controls = []

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Networking_WinSock"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"
